name: Build Prebuilt Artifacts

# Daily builds, staggered by channel to spread load (this does NOT extend the
# 6h per-job limit — ccache cross-run persistence is what lets large builds
# resume across runs).
on:
  schedule:
    - cron: '0 1 * * *'    # 01:00 UTC -> release channel
    - cron: '0 13 * * *'   # 13:00 UTC -> nightly channel
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: channel to build
        type: choice
        options: [release, nightly]
        default: release

permissions:
  contents: write

# Built on both ubuntu-22.04 (glibc 2.35, broadest compatibility) and
# ubuntu-24.04 (glibc 2.39), for amd64 and arm64. The os label is part of the
# asset name so downstreams pick the artifact matching their runtime glibc.
jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.ctx.outputs.channel }}
      dry_run: ${{ steps.ctx.outputs.dry_run }}
    steps:
      - id: ctx
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "dry_run=true"   >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 13 * * *" ]]; then
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false        # one tool/arch failing must not cancel the rest
      matrix:
        # tool × os × arch. The os label is embedded in asset names/tags so
        # builds on different glibc baselines (22.04=2.35, 24.04=2.39) never
        # collide.
        include:
          - { tool: tree-sitter, os: ubuntu-22.04, arch: amd64, runner: ubuntu-22.04 }
          - { tool: tree-sitter, os: ubuntu-22.04, arch: arm64, runner: ubuntu-22.04-arm }
          - { tool: tree-sitter, os: ubuntu-24.04, arch: amd64, runner: ubuntu-24.04 }
          - { tool: tree-sitter, os: ubuntu-24.04, arch: arm64, runner: ubuntu-24.04-arm }
          - { tool: llvm,        os: ubuntu-22.04, arch: amd64, runner: ubuntu-22.04 }
          - { tool: llvm,        os: ubuntu-22.04, arch: arm64, runner: ubuntu-22.04-arm }
          - { tool: llvm,        os: ubuntu-24.04, arch: amd64, runner: ubuntu-24.04 }
          - { tool: llvm,        os: ubuntu-24.04, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      CHANNEL: ${{ needs.setup.outputs.channel }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      # On PRs, skip the multi-hour llvm build; only validate the fast pipeline.
      SKIP: ${{ needs.setup.outputs.dry_run == 'true' && matrix.tool == 'llvm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # need tags for release idempotency check

      # Use the runner's system python3 (the builder is stdlib-only). We avoid
      # actions/setup-python because its arm64 prebuild requires GLIBC_2.38,
      # which would not load on our glibc-2.35 (ubuntu-22.04) baseline.
      - name: Install build dependencies
        if: ${{ env.SKIP != 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git python3

      - name: Resolve version & idempotency
        id: check
        if: ${{ env.SKIP != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m builder check --recipe ${{ matrix.tool }} \
            --channel "$CHANNEL" --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Restore ccache
        if: ${{ env.SKIP != 'true' && steps.check.outputs.needs_build == 'true' }}
        uses: actions/cache@v4
        with:
          path: .ccache
          # Bound to tool+os+arch+channel+version so a new version starts fresh
          # but repeated/resumed runs of the same version reuse objects.
          key: ccache-${{ matrix.tool }}-${{ matrix.os }}-${{ matrix.arch }}-${{ env.CHANNEL }}-${{ steps.check.outputs.version }}
          restore-keys: |
            ccache-${{ matrix.tool }}-${{ matrix.os }}-${{ matrix.arch }}-${{ env.CHANNEL }}-

      - name: Build, package & smoke-test
        if: ${{ env.SKIP != 'true' && steps.check.outputs.needs_build == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m builder build --recipe ${{ matrix.tool }} \
            --channel "$CHANNEL" --os ${{ matrix.os }} --arch ${{ matrix.arch }} \
            --version "${{ steps.check.outputs.version }}" \
            --workdir work --out dist --ccache-dir .ccache --results-dir results

      - name: Record skipped result
        if: ${{ env.SKIP != 'true' && steps.check.outputs.needs_build == 'false' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from builder.core import report
          report.write_result(Path("results"), report.Result(
              tool="${{ matrix.tool }}", channel="${{ env.CHANNEL }}",
              os="${{ matrix.os }}", arch="${{ matrix.arch }}", status="skipped",
              version="${{ steps.check.outputs.version }}",
              note="tag already published"))
          PY

      - name: Upload result JSON
        if: ${{ always() && env.SKIP != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.tool }}-${{ matrix.os }}-${{ matrix.arch }}
          path: results/
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: >-
          ${{ env.SKIP != 'true' && env.DRY_RUN != 'true'
              && steps.check.outputs.needs_build == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          # Nightly: same tag every day -> rolling overwrite (only reached after
          # a successful build + smoke test, so a failure never clobbers the
          # previous good artifact).
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/MANIFEST.json

  report:
    needs: build
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write          # maintain the tracking issue (no SMTP/secrets needed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: result-*
          merge-multiple: true
      - name: Render report
        id: render
        run: |
          python3 -m builder report --results-dir all-results \
            --issue-body-file body.md || true   # don't let red status skip publish
      - name: Publish to tracking issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[prebuilt] latest build status"
          LABEL: daily-build
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color BFD4F2 \
            --description "Daily prebuilt build status" 2>/dev/null || true
          # Reuse the single open tracking issue; create it the first time.
          num=$(gh issue list --state open --label "$LABEL" --limit 1 --json number \
                  --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            url=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md)
            echo "created tracking issue: $url"
          else
            gh issue edit "$num" --body-file body.md      # refresh body (silent)
            # A comment is what actually emails watchers — only when noteworthy.
            if [ "${{ steps.render.outputs.notify }}" = "true" ]; then
              gh issue comment "$num" --body-file body.md
            fi
            echo "updated tracking issue #$num (notify=${{ steps.render.outputs.notify }})"
          fi
